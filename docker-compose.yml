services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: postgres-pgvector
    restart: always
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_pgvector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistema_multimodal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de docker-compose el backend habla con el servicio
      # de postgres por su nombre y puerto interno (no el 5433 publicado al host).
      PGHOST: postgres-pgvector
      PGPORT: 5432
      BASE_URL: ${BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      # Indices/codebooks ya construidos (o regenerados con los pipelines);
      # se montan en vez de copiarse a la imagen para no inflarla y para
      # poder actualizarlos sin rebuild.
      - ./audio/data:/app/audio/data
      - ./imagen/data:/app/imagen/data
      - ./texto/data:/app/texto/data
    depends_on:
      postgres-pgvector:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: multimodal-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_pgvector_data:
