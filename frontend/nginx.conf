server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: cualquier ruta que no sea un archivo estatico cae en index.html
        # para que react-router maneje el enrutamiento del lado del cliente.
        try_files $uri $uri/ /index.html;
    }
}
